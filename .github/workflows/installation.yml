name: Installation and speech protocol
on:
  push:
    branches: [main, 'sukhovskiy.a.a/install-admin-whisper', 'sukhovskiy.a.a/installer-domain-recovery', 'sukhovskiy.a.a/installer-server-verified']
    tags: ['install-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Ubuntu bootstrap syntax
        if: runner.os == 'Linux'
        run: bash -n install/install-ubuntu.sh
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.19'
          python-version: '3.12.12'
          activate-environment: 'true'
          enable-cache: 'false'
      - run: uv pip sync --require-hashes install/requirements.lock
      - run: python -m pytest backend/tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
  package:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Fetch frontend assets only
        run: git lfs pull --include='frontend/**' --exclude='models/**'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - name: Build verified bundle
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/install-v') && github.ref_name || format('install-v{0}-{1}', github.run_id, github.run_attempt) }}
        run: python install/build_release.py --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: arena-installation-bundle
          path: |
            release-artifacts/*
            install/install-windows.ps1
            install/install-ubuntu.sh
      - name: Publish verified installation bundle
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/install-v'))
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/install-v') && github.ref_name || format('install-v{0}-{1}', github.run_id, github.run_attempt) }}
        run: |
          gh release create "$RELEASE_TAG" release-artifacts/* install/install-windows.ps1 install/install-ubuntu.sh --target "$GITHUB_SHA" --draft --title "Установка сайта и Whisper — $RELEASE_TAG" --notes-file docs/INSTALLATION_RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
